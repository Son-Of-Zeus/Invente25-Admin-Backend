services:
  backend:
    build: ./backend
    container_name: invente26-admin-backend
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
    ports:
      - "4000:4000"
    # volumes: 
      # - ./backend:/usr/src/app # defeats the purpose of the image
      # - /usr/src/app/node_modules # same reason as above
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - default
      - payment_backend_network
      
volumes:
  db_data:
networks:
  payment_backend_network:
    external: true
    name: server-only-compose_backend-network
