services:
  backend:
    build: ./backend
    # image: irfanakthar/invente25-admin-backend:v2
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      # Inside Compose, PostgreSQL is reached through the service name.
      # The host-side 5499 mapping is only for tools running on the host.
      - PAYMENT_VERIF_URL=http://payment-verif.local/verify-cash
      - PAYMENT_VERIF_API_KEY=devapikey
      - SYNC_EVENTS_ENABLED=true
      - SYNC_EVENTS_CRON=*/2 * * * * # every 2 minutes and once per startup
      - EVENTS_API_URL=https://ssnsnucinvente.com/api/events?pagination[pageSize]=140
      - PAYMENT_SERVICE_URL=http://localhost:8080/api/payment
      - RECEIPT_SERVICE_URL=http://localhost:8080/restricted/receipt
      - MASTER_PW=itsmeirfan
      - TECH_PASS_PRICE=300
      - NON_TECH_DEFAULT_PRICE=300
      - WORKSHOP_PRICE=300
      - PAYMENT_SERVICE_SECRET=rjkgsigirgrlgrl123y4t5u6i7o8p0d
      - MAIL_SERVICE_SECRET=rjkgsigirgrlgrl123y4t5u6i7o8p0d
      - GOOGLE_APPLICATION_CREDENTIALS=credentials.json
      - MASTER_ADMIN_EMAILS=irfanakthar@ssn.edu.in
      - MAIL_SERVICE_URL=http://localhost:8080/api/sendOTP
    ports:
      - "4000:4000"
    # volumes: 
      # - ./backend:/usr/src/app # defeats the purpose of the image
      # - /usr/src/app/node_modules # same reason as above
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - default
      - payment_backend_network

  frontend:
    build: ./frontend
    #image: irfanakthar/invente25-admin-frontend:v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:4000
      - VITE_TECH_PASS_PRICE=300
      - VITE_WORKSHOP_PRICE=300
      - VITE_NON_TECH_DEFAULT_PRICE=300
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  db_data:
networks:
  payment_backend_network:
    external: true
    name: server-only-compose_backend-network
